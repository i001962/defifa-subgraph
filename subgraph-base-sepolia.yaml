specVersion: 0.0.4
schema:
  file: ./schema.graphql
description: Defifa Subgraph for Base Sepolia Network
dataSources:
  - kind: ethereum
    name: DefifaDeployer
    network: base-sepolia
    source:
      abi: DefifaDeployer
      address: "0xaa1c5d7bee4cc88523286774dffeab26687ec0ff"
      startBlock: 208641575
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Contract
      abis:
        - name: DefifaDeployer
          file: ./abis/DefifaDeployer.json
        - name: DefifaNFT
          file: ./abis/DefifaNFT.json
        - name: DefifaGovernor
          file: ./abis/DefifaGovernor.json
      eventHandlers:
        - event: LaunchGame(indexed uint256,indexed address,indexed address,address,address)
          handler: handleLaunchGame
        - event: QueuedRefundPhase(indexed uint256,address)
          handler: handleQueuedRefundPhase
        - event: QueuedScoringPhase(indexed uint256,address)
          handler: handleQueuedScoringPhase
        - event: QueuedNoContest(indexed uint256,address)
          handler: handleQueuedNoContest
        - event: FulfilledCommitments(indexed uint256,uint256,address)
          handler: handleFulfilledCommitments
      file: ./src/mappings/defifa-deployer.ts
templates:
  - name: DefifaNFT
    kind: ethereum/contract
    network: base-sepolia
    source:
      abi: DefifaNFT
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/defifa-nft.ts
      entities:
        - Token
        - TokenMetadata
        - Owner
        - Transfer
        - Contract
      abis:
        - name: DefifaNFT
          file: ./abis/DefifaNFT.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: Mint(indexed uint256,indexed uint256,indexed address,uint256,address)
          handler: handleMint
        - event: MintReservedToken(indexed uint256,indexed uint256,indexed address,address)
          handler: handleMintReservedToken
        - event: TierDelegateAttestationsChanged(indexed address,indexed uint256,uint256,uint256,address)
          handler: handleTierDelegateAttestationsChanged
  - name: Governor
    kind: ethereum/contract
    network: base-sepolia
    source:
      abi: DefifaGovernor
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/governor.ts
      entities:
        - Governor
      abis:
        - name: DefifaGovernor
          file: ./abis/DefifaGovernor.json
      eventHandlers:
        - event: GameInitialized(indexed uint256,uint256,uint256,address)
          handler: handleGameInitialized
        - event: ScorecardSubmitted(indexed uint256,indexed uint256,(uint256,uint256)[],bool,address)
          handler: handleScorecardSubmitted
        - event: ScorecardAttested(indexed uint256,indexed uint256,uint256,address)
          handler: handleScorecardAttested
        - event: ScorecardRatified(indexed uint256,indexed uint256,address)
          handler: handleScorecardRatified
  - name: TokenMetadata
    kind: file/ipfs
    network: base-sepolia
    mapping:
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/metadata.ts
      handler: handleMetadata
      entities:
        - TokenMetadata
      abis:
        - name: DefifaNFT
          file: ./abis/DefifaNFT.json
